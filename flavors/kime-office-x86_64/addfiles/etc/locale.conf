# System locale (SliTaz convention). UTF-8 codeset is required for ncursesw
# to render accents + box-drawing in the wove/trame TUI. No LC_ALL line here:
# /etc/init.d/system.sh sets LC_ALL=$LANG at boot, and a stale LC_ALL=en_US
# (non-UTF-8) sourced by /etc/profile would otherwise override LANG in login
# shells. `trame locale set <lang>.UTF-8` (or grub lang=*.UTF-8) rewrites LANG.
LANG="en_US.UTF-8"
