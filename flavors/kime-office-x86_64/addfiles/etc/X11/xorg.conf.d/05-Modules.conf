# xorg-server 1.12: the elf loader does not autoload driver sub-modules,
# vesa dlopen dies on VBESetModeParameters (libvbe) and fbdev on
# fbdevHWSave (libfbdevhw). Preload them; harmless for other drivers.
Section "Module"
	# int10 first: libvbe resolves xf86int10Addr against it, and the elf
	# loader does not go looking for it on its own.
	Load "int10"
	Load "vbe"
	Load "fb"
	Load "shadow"
	Load "fbdevhw"
	# No GL driver on the ISO (mesa-dri not shipped): without GLX, no
	# AIGLX swrast error and no GLX extension advertised to clients.
	Disable "glx"
EndSection
